<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>جدولي الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1119;
    --bg-soft: #131826;
    --surface: #171d2c;
    --surface-2: #1e2536;
    --line: #262e42;
    --text: #eef1f8;
    --text-dim: #93a0bd;
    --text-faint: #5c6884;
    --gold: #d9ac57;
    --gold-dim: #8a7247;
    --holiday: #3ea36f;
    --exam: #d97a5a;

    --c-coe326: #7c6bf0;
    --c-cs214: #3fb6d1;
    --c-coe361: #b8d64a;
    --c-coe325: #e18fb0;
    --c-math329: #6b7688;
    --c-coe362: #5ec26b;
    --c-cs383: #e0973c;
    --busy: #3a7a52;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Tajawal', sans-serif; min-height:100%;}
  body{
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(124,107,240,0.14), transparent 60%),
      radial-gradient(900px 400px at 10% 0%, rgba(217,172,87,0.08), transparent 55%),
      var(--bg);
    padding-bottom: 60px;
  }
  .wrap{max-width: 760px; margin:0 auto; padding: 18px 16px 0;}

  /* header */
  header{padding: 14px 2px 10px;}
  .eyebrow{font-size:12px; letter-spacing:.5px; color:var(--gold); font-weight:700; display:flex; align-items:center; gap:6px;}
  .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block;}
  h1{font-family:'Cairo', sans-serif; font-weight:800; font-size: 26px; margin: 6px 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-dim); font-size:13.5px; margin:0;}

  /* progress strip */
  .progress-row{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .progress-track{flex:1; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; position:relative;}
  .progress-fill{height:100%; border-radius:4px; background:linear-gradient(90deg, var(--gold-dim), var(--gold));}
  .progress-label{font-size:11.5px; color:var(--text-faint); white-space:nowrap; font-weight:700;}

  /* week nav */
  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding: 12px 10px; margin-top:16px;
  }
  .wn-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; transition: transform .12s ease, background .15s ease;
  }
  .wn-btn:active{transform:scale(.92); background: var(--gold-dim);}
  .wn-mid{text-align:center; flex:1;}
  .wn-title{font-family:'Cairo',sans-serif; font-weight:700; font-size:15.5px;}
  .wn-range{font-size:11.5px; color:var(--text-dim); margin-top:2px; direction:ltr; display:inline-block;}
  .wn-hijri{font-size:10.5px; color:var(--text-faint); margin-top:1px; direction:ltr; display:block;}
  .wn-badge{
    display:inline-block; margin-top:5px; font-size:10.5px; font-weight:700; padding:2px 10px; border-radius:20px;
  }
  .wn-badge.holiday{background:rgba(62,163,111,.16); color:var(--holiday); border:1px solid rgba(62,163,111,.35);}
  .wn-badge.exam{background:rgba(217,122,90,.16); color:var(--exam); border:1px solid rgba(217,122,90,.35);}

  /* day tabs */
  .day-tabs{display:flex; gap:6px; margin-top:16px; overflow-x:auto; padding-bottom:2px;}
  .day-tab{
    flex:1; min-width:64px; text-align:center; padding:10px 4px 8px; border-radius:13px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer; position:relative;
    transition: background .15s ease, border-color .15s ease;
  }
  .day-tab .dname{font-size:12.5px; font-weight:700; color:var(--text-dim);}
  .day-tab .ddate{font-size:15px; font-weight:800; font-family:'Cairo',sans-serif; margin-top:3px; color:var(--text);}
  .day-tab .dhijri{font-size:9.5px; color:var(--text-faint); margin-top:1px; direction:ltr;}
  .day-tab .ddot{width:5px; height:5px; border-radius:50%; background:var(--gold); margin:5px auto 0; opacity:0;}
  .day-tab.has-note .ddot{opacity:1;}
  .day-tab.active{background:linear-gradient(180deg, rgba(217,172,87,.16), rgba(217,172,87,.05)); border-color:var(--gold-dim);}
  .day-tab.active .dname{color:var(--gold);}
  .day-tab.today .ddate{color:var(--gold);}
  .day-tab.today::after{content:"اليوم"; position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:9px; background:var(--gold); color:#211804; padding:1px 7px; border-radius:20px; font-weight:800;}
  .day-tab.has-exam{border-color:rgba(217,122,90,.5);}
  .day-tab.has-exam .ddate{color:var(--exam);}
  .day-tab .dexam{font-size:9px; margin-top:2px;}

  /* courses */
  .section-title{font-family:'Cairo',sans-serif; font-size:14.5px; font-weight:700; color:var(--text-dim); margin: 22px 2px 10px; display:flex; align-items:center; gap:8px;}
  .count-pill{background:var(--surface-2); color:var(--text-dim); font-size:11px; padding:1px 9px; border-radius:20px; font-weight:700;}

  .courses{display:flex; flex-direction:column; gap:10px;}
  .course-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
    display:flex; align-items:flex-start; gap:12px; position:relative; overflow:hidden;
  }
  .course-card::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--bar-color);}
  .c-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; color:#0d1119;
    background:var(--bar-color);
  }
  .c-info{flex:1; min-width:0;}
  .c-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .c-name{font-weight:700; font-size:14.5px; line-height:1.4;}
  .c-time{font-size:12px; font-weight:800; color:var(--text); background:var(--surface-2); padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .c-meta{font-size:12px; color:var(--text-dim); margin-top:4px; display:flex; flex-wrap:wrap; gap:6px 10px;}
  .c-meta span{display:flex; align-items:center; gap:4px;}
  .live-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; color:#ff6b6b;
    background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35); padding:2px 9px; border-radius:20px; margin-top:6px;
  }
  .live-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:#ff6b6b; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .empty-day{
    text-align:center; padding: 34px 10px; color:var(--text-faint); background:var(--surface);
    border:1px dashed var(--line); border-radius:14px; font-size:13.5px;
  }
  .empty-day .big{font-size:26px; display:block; margin-bottom:6px;}
  .busy-day{
    text-align:center; padding: 30px 14px; border-radius:14px; font-size:13.5px;
    background:linear-gradient(180deg, rgba(58,122,82,.18), rgba(58,122,82,.05)); border:1px solid rgba(58,122,82,.4); color:#bfe3cd;
  }
  .busy-day .big{font-size:24px; display:block; margin-bottom:6px;}
  .busy-day .small{color:var(--text-faint); font-size:11.5px; margin-top:4px;}

  .exam-card{
    background:linear-gradient(180deg, rgba(217,122,90,.14), rgba(217,122,90,.04));
    border:1px solid rgba(217,122,90,.4); border-radius:14px; padding:14px;
  }
  .exam-tag{
    display:inline-block; font-size:11px; font-weight:800; color:var(--exam);
    background:rgba(217,122,90,.16); border:1px solid rgba(217,122,90,.35);
    padding:2px 10px; border-radius:20px; margin-bottom:8px;
  }
  .exam-card .c-name{color:#f3d9cd;}

  /* notes */
  .notes-box{
    margin-top: 22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px;
  }
  .notes-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .notes-head .t{font-family:'Cairo',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; gap:7px;}
  .save-state{font-size:11px; color:var(--text-faint); transition:opacity .3s ease;}
  .save-state.saved{color:var(--holiday);}
  textarea{
    width:100%; min-height:110px; resize:vertical; background:var(--bg-soft); border:1px solid var(--line);
    border-radius:11px; color:var(--text); font-family:'Tajawal',sans-serif; font-size:14px; padding:11px 12px;
    outline:none; line-height:1.6;
  }
  textarea:focus{border-color:var(--gold-dim);}
  textarea::placeholder{color:var(--text-faint);}

  .loading{text-align:center; padding:60px 10px; color:var(--text-dim); font-size:13.5px;}

  /* manage panel */
  .manage-toggle{
    margin-top:16px; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px;
    font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; user-select:none;
  }
  .manage-toggle:active{background:var(--surface-2);}
  .manage-panel{
    margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px;
  }
  .manage-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .mtab{
    flex:1; text-align:center; padding:9px 4px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer;
    font-family:'Tajawal',sans-serif;
  }
  .mtab.active{background:linear-gradient(180deg, rgba(217,172,87,.18), rgba(217,172,87,.06)); border-color:var(--gold-dim); color:var(--gold);}

  .manage-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .manage-row{
    display:flex; align-items:center; gap:10px; background:var(--bg-soft); border:1px solid var(--line);
    border-radius:11px; padding:9px 11px;
  }
  .manage-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .manage-row .info{flex:1; min-width:0;}
  .manage-row .info .n{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .manage-row .info .d{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .manage-row .del{
    width:26px; height:26px; border-radius:8px; background:rgba(217,90,90,.12); border:1px solid rgba(217,90,90,.3);
    color:#e07a7a; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .manage-empty{text-align:center; color:var(--text-faint); font-size:12.5px; padding:14px;}

  .form-title{font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:10px;}
  .form-grid{display:flex; flex-direction:column; gap:9px;}
  .form-row{display:flex; gap:9px;}
  .form-row > *{flex:1; min-width:0;}
  .field label{font-size:11px; color:var(--text-faint); display:block; margin-bottom:4px;}
  .field input, .field select{
    width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:9px; color:var(--text);
    font-family:'Tajawal',sans-serif; font-size:13px; padding:8px 9px; outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--gold-dim);}
  .day-picker{display:flex; gap:5px; flex-wrap:wrap;}
  .day-chip{
    padding:6px 10px; border-radius:20px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--text-dim); font-size:12px; cursor:pointer; user-select:none;
  }
  .day-chip.picked{background:linear-gradient(180deg, rgba(217,172,87,.2), rgba(217,172,87,.08)); border-color:var(--gold-dim); color:var(--gold); font-weight:700;}
  .submit-btn{
    margin-top:2px; background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#231a08; border:none;
    border-radius:11px; padding:11px; font-size:13.5px; font-weight:800; cursor:pointer; font-family:'Tajawal',sans-serif;
  }
  .submit-btn:active{opacity:.85;}
  .reset-btn{
    margin-top:16px; width:100%; background:rgba(217,90,90,.1); border:1px solid rgba(217,90,90,.3);
    color:#e07a7a; border-radius:11px; padding:10px; font-size:12.5px; font-weight:700; cursor:pointer;
    font-family:'Tajawal',sans-serif;
  }

  /* assignments strip */
  .assign-strip{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .assign-strip-title{font-family:'Cairo',sans-serif; font-size:12.5px; font-weight:700; color:var(--text-dim);}
  .assign-chip{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 13px;}
  .ac-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px;}
  .ac-type{font-size:11.5px; font-weight:700; color:var(--text-dim); white-space:nowrap;}
  .ac-count{font-size:11px; font-weight:800; padding:2px 9px; border-radius:20px; background:rgba(217,172,87,.14); color:var(--gold); border:1px solid rgba(217,172,87,.3); white-space:nowrap;}
  .ac-count.overdue{background:rgba(217,90,90,.14); color:#e07a7a; border-color:rgba(217,90,90,.35);}
  .ac-title{font-size:14px; font-weight:700; margin-top:2px;}
  .ac-due{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
  .ac-actions{display:flex; gap:8px; margin-top:9px;}
  .ac-btn{flex:1; text-align:center; font-size:11.5px; font-weight:700; padding:7px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); cursor:pointer; text-decoration:none; font-family:'Tajawal',sans-serif;}
  .ac-btn:active{background:var(--gold-dim); color:#fff;}
  .assign-more{text-align:center; font-size:11.5px; color:var(--text-faint); padding:2px;}
</style>
</head>

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Intl.DateTimeFormat("ar-SA-u-nu-latn",{day:"numeric", month:"short"}).format(new Date(y,m-1,d));

function findCurrentWeekIndex(){
  const t = todayStr();
  for(let i=0;i<WEEKS.length;i++){

  return WEEKS.length-1;
}

async function loadNoteFlags(week){
  // Determine which days in this week already have notes, for the dot indicator
  const flags = {};
  DAY_KEYS.forEach(k=>{
    const key = "note:"+week[k];
    if(notesCache[key] === undefined){
      let val = "";
      try{ val = localStorage.getItem(key) || ""; }catch(e){ val = ""; }
      notesCache[key] = val;
    }
    flags[k] = !!(notesCache[key] && notesCache[key].trim());
  });
  return flags;

const PALETTE = ["#7c6bf0","#3fb6d1","#b8d64a","#e18fb0","#6b7688","#5ec26b","#e0973c","#4fc3a1","#d1738a","#8f7fe8","#5aa9e6","#c9a24c"];
function colorFor(key){
  let h = 0;
  for(let i=0;i<key.length;i++){ h = (h*31 + key.charCodeAt(i)) >>> 0; }
  return PALETTE[h % PALETTE.length];
}

function pad2(n){ return String(n).padStart(2,"0"); }

function assignDueDate(a){
  const [y,m,d] = a.dueDate.split("-").map(Number);
  const [hh,mm] = (a.dueTime || "23:59").split(":").map(Number);
  return new Date(y, m-1, d, hh, mm);
}

function countdownText(dueDT){
  const now = new Date();
  const diffMs = dueDT - now;
  const overdue = diffMs < 0;
  const abs = Math.abs(diffMs);
  const days = Math.floor(abs/86400000);
  const hours = Math.floor((abs%86400000)/3600000);
  let txt;
  if(days >= 1) txt = days + " يوم";
  else if(hours >= 1) txt = hours + " ساعة";
  else txt = "أقل من ساعة";
  return overdue ? ("متأخر " + txt) : ("باقي " + txt);
}

function googleCalUrl(a){
  const [y,m,d] = a.dueDate.split("-").map(Number);
  const [hh,mm] = (a.dueTime || "23:59").split(":").map(Number);
  const start = y + pad2(m) + pad2(d) + "T" + pad2(hh) + pad2(mm) + "00";
  const endDate = new Date(y, m-1, d, hh, mm);
  endDate.setHours(endDate.getHours()+1);
  const end = endDate.getFullYear() + pad2(endDate.getMonth()+1) + pad2(endDate.getDate()) + "T" + pad2(endDate.getHours()) + pad2(endDate.getMinutes()) + "00";
  const text = encodeURIComponent(`${a.type}: ${a.title}${a.code ? " ("+a.code+")" : ""}`);
  const details = encodeURIComponent(a.notes || "");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}&ctz=Asia/Riyadh`;
}

function downloadICS(a){
  if(!a) return;
  const [y,m,d] = a.dueDate.split("-").map(Number);
  const [hh,mm] = (a.dueTime || "23:59").split(":").map(Number);
  const dt = y + pad2(m) + pad2(d) + "T" + pad2(hh) + pad2(mm) + "00";
  const endDate = new Date(y, m-1, d, hh, mm);
  endDate.setHours(endDate.getHours()+1);
  const dtEnd = endDate.getFullYear() + pad2(endDate.getMonth()+1) + pad2(endDate.getDate()) + "T" + pad2(endDate.getHours()) + pad2(endDate.getMinutes()) + "00";
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
    "UID:" + a.id + "@study-schedule",
    "DTSTART:" + dt,
    "DTEND:" + dtEnd,
    "SUMMARY:" + a.type + ": " + a.title + (a.code ? " ("+a.code+")" : ""),
    "DESCRIPTION:" + (a.notes || "").replace(/\n/g,"\\n"),
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = (a.title || "assignment") + ".ics";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function fmtTime12(hm){
  let [h,m] = hm.split(":").map(Number);
  const period = h < 12 ? "ص" : "م";
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return h12 + ":" + String(m).padStart(2,"0") + " " + period;
}
function isLive(dateIso, start, end){
  if(dateIso !== todayStr()) return false;
  const n = nowHM();
  return n >= start && n <= end;
}

  document.querySelectorAll("[data-del-assign]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.delAssign;
      ASSIGNMENTS = ASSIGNMENTS.filter(a=>a.id!==id);
      saveAssignments();
      render();
    };
  });

  const addAssignBtn = document.getElementById("addAssignBtn");
  if(addAssignBtn){
    addAssignBtn.onclick = ()=>{
      const type = document.getElementById("aType").value;
      const code = document.getElementById("aCode").value.trim();
      const title = document.getElementById("aTitle").value.trim();
      const dueDate = document.getElementById("aDate").value;
      const dueTime = document.getElementById("aTime").value;
      const notes = document.getElementById("aNotes").value.trim();
      if(!title || !dueDate){
        alert("لازم تكتب العنوان وتاريخ التسليم على الأقل");
        return;
      }
      ASSIGNMENTS.push({id:genId(), type, code, title, dueDate, dueTime, notes});
      saveAssignments();
      render();
    };
  }
}

function render(){
  const app = document.getElementById("app");
  const w = WEEKS[weekIdx];
  const t = todayStr();
  const progressPct = Math.round((weekIdx+1)/WEEKS.length*100);

  let badge = "";
  if(w.holiday) badge = `<div class="wn-badge holiday">إجازة</div>`;
  if(w.exam) badge = `<div class="wn-badge exam">أسبوع اختبارات</div>`;

  app.innerHTML = `
    <header>
      <div class="eyebrow">الفصل الدراسي الأول &nbsp;·&nbsp; 481</div>
      <h1>جدولي الدراسي</h1>
      <p class="sub">هندسة الحاسب — تابع محاضراتك ودوّن ملاحظاتك يوم بيوم</p>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
        <div class="progress-label">الأسبوع ${w.n} من ${WEEKS.length}</div>
      </div>
    </header>

    <div class="week-nav">
      <div class="wn-btn" id="prevWeek">‹</div>
      <div class="wn-mid">
        <div class="wn-title">الأسبوع ${w.n}</div>
        <div class="wn-range">${fmtDate(w.sun)} – ${fmtDate(w.thu)}</div>
        <div class="wn-hijri">${fmtHijri(w.h.sun)} – ${fmtHijri(w.h.thu)}</div>
        ${badge}
      </div>
      <div class="wn-btn" id="nextWeek">›</div>
    </div>

    ${upcomingAssignmentsHtml()}

    <div class="day-tabs" id="dayTabs">
      ${DAY_KEYS.map(k=>`
        <div class="day-tab ${k===activeDay?'active':''} ${w[k]===t?'today':''} ${FINALS.some(f=>f.date===w[k])?'has-exam':''}" data-day="${k}">
          <div class="dname">${DAY_NAMES[k]}</div>
          <div class="ddate">${fmtDate(w[k])}</div>
          <div class="dhijri">${fmtHijri(w.h[k])}</div>
          ${FINALS.some(f=>f.date===w[k]) ? `<div class="dexam">📝</div>` : `<div class="ddot"></div>`}
        </div>
      `).join("")}
    </div>

    <div class="section-title">
      ${FINALS.some(f=>f.date===w[activeDay]) ? 'اختبار' : 'محاضرات'} ${DAY_NAMES[activeDay]}
      <span class="count-pill">${FINALS.some(f=>f.date===w[activeDay]) ? FINALS.filter(f=>f.date===w[activeDay]).length : COURSES[activeDay].length}</span>
    </div>
    <div class="courses" id="coursesBox">
      ${renderDayBody(w)}
    </div>

    <div class="notes-box">
      <div class="notes-head">
        <div class="t">📝 ملاحظات ${DAY_NAMES[activeDay]}</div>
        <div class="save-state" id="saveState"></div>
      </div>
      <textarea id="noteArea" placeholder="اكتب ملاحظاتك، واجبات، أو تذكيرات لهذا اليوم...">${notesCache["note:"+w[activeDay]] ?? ""}</textarea>
    </div>

    <div class="manage-toggle" id="manageToggle">${managePanelOpen ? '▲ إخفاء' : '⚙️ عدّل جدولك'}</div>
    ${managePanelOpen ? renderManagePanel() : ''}
  `;

  document.getElementById("prevWeek").onclick = ()=>{
    if(weekIdx>0){ weekIdx--; syncActiveDayFallback(); refreshAndRender(); }
  };
  document.getElementById("nextWeek").onclick = ()=>{
    if(weekIdx<WEEKS.length-1){ weekIdx++; syncActiveDayFallback(); refreshAndRender(); }
  };
  document.querySelectorAll(".day-tab").forEach(el=>{
    el.onclick = ()=>{ activeDay = el.dataset.day; refreshAndRender(); };
  });

  const noteArea = document.getElementById("noteArea");
  const saveState = document.getElementById("saveState");
  noteArea.addEventListener("input", ()=>{
    saveState.textContent = "...جارٍ الحفظ";
    saveState.classList.remove("saved");
    clearTimeout(saveTimer);
    const dateKey = "note:"+WEEKS[weekIdx][activeDay];
    const val = noteArea.value;
    saveTimer = setTimeout(()=>{
      try{
        localStorage.setItem(dateKey, val);
        notesCache[dateKey] = val;
        saveState.textContent = "تم الحفظ ✓";
        saveState.classList.add("saved");
        markDot();
      }catch(e){
        saveState.textContent = "تعذّر الحفظ";
      }
    }, 400);
  });

  markDot();
  wireManagePanel();
  document.querySelectorAll("[data-ics]").forEach(el=>{
    el.onclick = ()=>{
      const a = ASSIGNMENTS.find(x=>x.id === el.dataset.ics);
      downloadICS(a);
    };
  });
}

function markDot(){
  const w = WEEKS[weekIdx];
  document.querySelectorAll(".day-tab").forEach(el=>{
    const k = el.dataset.day;
    const has = !!(notesCache["note:"+w[k]] && notesCache["note:"+w[k]].trim());
    el.classList.toggle("has-note", has);
  });
}

function syncActiveDayFallback(){
  // keep same weekday selected when switching weeks; sun default already fine since keys match
}

async function refreshAndRender(){
  render();
  await loadNoteFlags(WEEKS[weekIdx]);
  render();
}

refreshAndRender();
setInterval(()=>{ if(!managePanelOpen) render(); }, 60000);
</script>
</body>
</html>
